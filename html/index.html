<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minibob</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e3e1dc; --accent:#2f6f4f; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161617; --card:#1f1f21; --fg:#f2f2f2; --muted:#9a9aa0; --line:#2e2e31; --accent:#6fc59a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.02em; }
  p.sub { margin: 0 0 32px; color: var(--muted); }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  a.card { display:block; padding:18px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .name { font-weight:600; font-size:16px; }
  .desc { color:var(--muted); font-size:13px; margin-top:2px; }
  .port { display:inline-block; margin-top:10px; font:12px ui-monospace, Menlo, monospace; color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>minibob</h1>
  <p class="sub">Services running on this machine</p>
  <div class="grid" id="links"></div>
</main>
<script>
  // Add new services here: name, description, port, optional path
  const services = [
    { name: "Paperless-ngx", desc: "Document management", port: 8001 },
  ];
  const host = location.hostname;
  document.getElementById("links").innerHTML = services.map(s =>
    `<a class="card" href="${location.protocol}//${host}:${s.port}${s.path || "/"}">
       <div class="name">${s.name}</div><div class="desc">${s.desc}</div>
       <span class="port">:${s.port}</span></a>`).join("");
</script>
</body>
</html>
